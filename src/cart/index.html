<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
      
    </header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>

        <ul class="product-list">
         
        </ul>
        <!-- Empty container: the total is inserted here only when the cart has items. -->
        <div id="cart-total-container"></div>

        <!-- Template: not displayed. JavaScript copies it when there is something to total. -->
        <template id="cart-total-template">
          <div class="cart-footer">
            <p class="cart-total">Total: $<span class="cart-total__amount"></span></p>
          </div>
        </template>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>

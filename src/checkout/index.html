
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <div id="order-summary" class="checkout-summary"></div>

        <form id="checkout-form">
          <h3>Customer Information</h3>

          <label>
            First Name
            <input type="text" name="fname" required />
          </label>

          <label>
            Last Name
            <input type="text" name="lname" required />
          </label>

          <label>
            Street Address
            <input type="text" name="street" required />
          </label>

          <label>
            City
            <input type="text" name="city" required />
          </label>

          <label>
            State
            <input type="text" name="state" required />
          </label>

          <label>
            Zip Code
            <input type="text" name="zip" required />
          </label>

          <h3>Payment Information</h3>

          <label>
            Credit Card Number
            <input
              type="text"
              name="cardNumber"
              inputmode="numeric"
              autocomplete="cc-number"
              required
            />
          </label>

          <label>
            Expiration Date
            <input type="text" name="expiration" placeholder="MM/YY" required />
          </label>

          <label>
            Security Code
            <input type="text" name="code" inputmode="numeric" required />
          </label>

          <button type="submit">Place Order</button>
        </form>

        <div id="checkout-message"></div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>

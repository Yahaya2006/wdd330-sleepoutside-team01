<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <!-- "required" blocks submission until every field is filled in -->
        <form id="checkout-form">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />
        
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />
          </fieldset>
        
          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />
        
            <label for="city">City</label>
            <input type="text" id="city" name="city" required />
        
            <label for="state">State</label>
            <input type="text" id="state" name="state" required />
        
            <label for="zip">Zip Code</label>
            <!-- Accepts 83440, QW198, or QW-198 -->
            <input type="text" id="zip" name="zip" required pattern="[0-9]{5}|[A-Za-z]{2}-?[0-9]{3}"
              title="5 digits (83440) or 2 letters + 3 digits (QW198 or QW-198)" />
          </fieldset>
        
          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required pattern="[0-9]{16}" title="16 digits, no spaces" />
        
            <label for="expiration">Expiration Date</label>
            <input type="text" id="expiration" name="expiration" required placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}"
              title="Format: MM/YY" />
        
            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required pattern="[0-9]{3,4}" title="3 or 4 digits" />
          </fieldset>
        
          <!-- Order summary: these ids are filled in by CheckoutProcess.mjs -->
          <fieldset class="order-summary">
            <legend>Order Summary</legend>
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Tax: <span id="tax">$0.00</span></p>
            <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
            <p><strong>Order Total: <span id="orderTotal">$0.00</span></strong></p>
          </fieldset>
        
          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
